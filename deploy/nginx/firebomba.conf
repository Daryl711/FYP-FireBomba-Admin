# Nginx site config for FireBomba Admin on EC2.
# Serves the Expo web build (frontend/dist) as a static SPA and reverse-proxies
# the API to the Express backend on localhost:3000 (same origin => no CORS /
# mixed-content issues).
#
# Install:
#   Ubuntu:        sudo cp firebomba.conf /etc/nginx/sites-available/firebomba
#                  sudo ln -s /etc/nginx/sites-available/firebomba /etc/nginx/sites-enabled/
#                  sudo rm -f /etc/nginx/sites-enabled/default
#   Amazon Linux:  sudo cp firebomba.conf /etc/nginx/conf.d/firebomba.conf
#   Then:          sudo nginx -t && sudo systemctl reload nginx
#
# Replace server_name with your domain (or "_" to match the bare EC2 IP).
# certbot --nginx will add the HTTPS (443) block and redirect automatically.

server {
    listen 80;
    server_name _;

    root /var/www/firebomba;
    index index.html;

    # API -> Express backend
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://127.0.0.1:3000;
    }

    # Hashed static assets can be cached aggressively
    location /_expo/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback: every other path serves index.html
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
